<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6B5B95">
<title>Lingo Data Gen — 구문 생성 & 관리</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans KR',sans-serif}
body{background:#121214;color:#fff;min-height:100vh;padding:20px;max-width:800px;margin:0 auto}

h1{font-size:1.5rem;margin-bottom:5px;background:linear-gradient(135deg,#6B5B95,#FF6F61);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:rgba(255,255,255,.5);font-size:.9rem;margin-bottom:20px}

.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:10px}
.tab{padding:8px 16px;border-radius:50px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:rgba(255,255,255,.7);font-size:13px;cursor:pointer;transition:all .3s}
.tab:hover{border-color:#FF6F61;color:#FF6F61}
.tab.active{border-color:#FF6F61;background:rgba(255,111,97,.2);color:#FF6F61}

.panel{display:none}
.panel.active{display:block}

.section{background:rgba(255,255,255,.06);border-radius:16px;padding:20px;margin-bottom:20px}
.section-title{font-size:1.1rem;font-weight:700;margin-bottom:15px;color:#FF6F61}

label{display:block;margin-bottom:6px;font-size:13px;color:rgba(255,255,255,.7)}
input,select,textarea{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:14px;margin-bottom:12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#FF6F61}
textarea{min-height:80px;font-family:monospace;font-size:12px;resize:vertical}

.btn{padding:10px 20px;border-radius:50px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:all .3s;margin-right:8px;margin-bottom:8px}
.btn-primary{background:linear-gradient(135deg,#FF6F61,#6B5B95);color:#fff}
.btn-secondary{background:rgba(255,255,255,.15);color:#fff}
.btn-danger{background:rgba(255,80,80,.3);color:#ff5050}
.btn:hover{transform:scale(1.05)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

.chunk-list{max-height:300px;overflow-y:auto;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px}
.chunk-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;transition:all .2s}
.chunk-item:hover{background:rgba(255,255,255,.08)}
.chunk-item.active{background:rgba(255,111,97,.15);border-radius:8px}
.chunk-name{font-size:13px;font-weight:600}
.chunk-count{font-size:11px;color:rgba(255,255,255,.5)}

.phrase-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 40px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.phrase-row input{background:rgba(255,255,255,.05);border:none;padding:8px;font-size:12px}
.phrase-row .del-btn{color:#ff5050;cursor:pointer;text-align:center;font-size:18px}

.status-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(18,18,20,.95);border-top:1px solid rgba(255,255,255,.1);padding:12px 20px;font-size:12px;color:rgba(255,255,255,.6);display:flex;justify-content:space-between;align-items:center;z-index:100}

.api-key-hint{font-size:11px;color:rgba(255,255,255,.4);margin-top:-8px;margin-bottom:12px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;z-index:200;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#1a1a2e;border-radius:20px;padding:25px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto}
.modal-title{font-size:1.2rem;font-weight:700;margin-bottom:15px}
.modal-text{font-size:14px;line-height:1.6;color:rgba(255,255,255,.8);white-space:pre-wrap;word-break:break-word}
.modal-close{margin-top:15px;padding:10px 25px;border-radius:50px;border:none;background:linear-gradient(135deg,#FF6F61,#6B5B95);color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<h1>✨ Lingo Data Gen</h1>
<div class="subtitle">구문 생성 · 청크 관리 · 병합 ·보내기</div>

<div class="tabs">
  <button class="tab active" onclick="showPanel('p-chunks')">📁 청크 관리</button>
  <button class="tab" onclick="showPanel('p-generate')">🤖 AI 생성</button>
  <button class="tab" onclick="showPanel('p-merge')">🔀 병합</button>
  <button class="tab" onclick="showPanel('p-settings')">⚙️ 설정</button>
</div>

<!-- PANEL: Chunks -->
<div class="panel active" id="p-chunks">
  <div class="section">
    <div class="section-title">📂 청크 선택</div>
    <div class="grid-2">
      <div>
        <label>카테고리</label>
        <select id="chunkCat">
          <option value="etc">기타 (etc)</option>
          <option value="travel">여행 (travel)</option>
          <option value="golf">골프 (golf)</option>
          <option value="shop">쇼핑 (shop)</option>
          <option value="restaurant">레스토랑 (restaurant)</option>
          <option value="direction">길찾기 (direction)</option>
          <option value="hotel">호텔 (hotel)</option>
          <option value="airport">공항 (airport)</option>
          <option value="emergency">응급상황 (emergency)</option>
        </select>
      </div>
      <div>
        <label>레벨</label>
        <select id="chunkLvl">
          <option value="beginner">초급</option>
          <option value="intermediate">중급</option>
          <option value="advanced">고급</option>
        </select>
      </div>
    </div>
    <button class="btn btn-primary" onclick="loadChunk()">📂 불러오기</button>
    <button class="btn btn-secondary" onclick="newChunk()">➕ 새 청크</button>
  </div>

  <div class="section" id="chunkEditor" style="display:none">
    <div class="section-title">✏️ 구문 편집 — <span id="editingLabel"></span></div>
    <div id="phraseList"></div>
    <button class="btn btn-primary" onclick="addPhraseRow()">➕ 구문 추가</button>
    <button class="btn btn-secondary" onclick="saveChunk()">💾 저장</button>
    <button class="btn btn-secondary" onclick="importJSON()">📁 JSON 가져오기</button>
    <button class="btn btn-secondary" onclick="exportChunk()">📤 JSON 보내기</button>
    <button class="btn btn-danger" onclick="deleteChunk()">🗑️ 삭제</button>
  </div>
</div>

<!-- PANEL: AI Generate -->
<div class="panel" id="p-generate">
  <div class="section">
    <div class="section-title">🤖 AI 구문 생성</div>
    <label>OpenAI API Key (Browser에서 직접 호출)</label>
    <input type="password" id="apiKey" placeholder="sk-..." onchange="saveApiKey()">
    <div class="api-key-hint">키는 localStorage에만 저장되며 서버로 전송되지 않습니다. <a href="https://platform.openai.com/api-keys" target="_blank" style="color:#FF6F61">발급하기 ↗</a></div>

    <div class="grid-3">
      <div>
        <label>카테고리</label>
        <select id="genCat">
          <option value="etc">기타</option><option value="travel">여행</option><option value="golf">골프</option>
          <option value="shop">쇼핑</option><option value="restaurant">레스토랑</option><option value="direction">길찾기</option>
          <option value="hotel">호텔</option><option value="airport">공항</option><option value="emergency">응급</option>
        </select>
      </div>
      <div>
        <label>레벨</label>
        <select id="genLvl">
          <option value="beginner">초급</option><option value="intermediate">중급</option><option value="advanced">고급</option>
        </select>
      </div>
      <div>
        <label>개수</label>
        <input type="number" id="genCount" value="10" min="1" max="50">
      </div>
    </div>

    <label>프롬프트 (선택적 수정)</label>
    <textarea id="genPrompt">Generate {{count}} practical {{level}} Korean learning phrases for "{{category}}" scenario. Output JSON array: [{"en":"...","jp":"...","ko":"...","zh":"..."}]</textarea>

    <button class="btn btn-primary" id="genBtn" onclick="generatePhrases()">✨ 생성 시작</button>
    <div id="genStatus" style="margin-top:10px;font-size:13px;color:rgba(255,255,255,.5)"></div>
  </div>

  <div class="section" id="genResult" style="display:none">
    <div class="section-title">📋 생성 결과</div>
    <div id="genPreview"></div>
    <button class="btn btn-primary" onclick="acceptGenerated()">💾 청크에 저장</button>
    <button class="btn btn-secondary" onclick="discardGenerated()">🗑️ 버리기</button>
  </div>
</div>

<!-- PANEL: Merge -->
<div class="panel" id="p-merge">
  <div class="section">
    <div class="section-title">🔀 병합 &보내기</div>
    <p style="font-size:13px;color:rgba(255,255,255,.6);margin-bottom:15px">모든 청크를 하나의 phrases_ollama.json 형식으로 병합합니다.</p>
    
    <button class="btn btn-primary" onclick="mergeAllChunks()">🔀 전체 병합</button>
    <button class="btn btn-secondary" onclick="previewMerge()">👁️ 미리보기</button>
    <button class="btn btn-secondary" onclick="exportMerged()">📤 JSON 파일보내기</button>
    <button class="btn btn-primary" onclick="deployToLingo()">🚀 Lingo 앱에 배포</button>
  </div>

  <div class="section" id="mergePreview" style="display:none">
    <div class="section-title">📊 병합 통계</div>
    <div id="mergeStats"></div>
    <textarea id="mergeOutput" style="width:100%;height:300px;margin-top:10px" readonly></textarea>
  </div>
</div>

<!-- PANEL: Settings -->
<div class="panel" id="p-settings">
  <div class="section">
    <div class="section-title">⚙️ 설정 & 도구</div>
    <button class="btn btn-secondary" onclick="loadDefaultPhrases()">📥 서버 원본 불러오기</button>
    <button class="btn btn-secondary" onclick="clearAllChunks()">🗑️ 모든 청크 삭제</button>
    <button class="btn btn-secondary" onclick="showModal('도움말',HELP_TEXT)">❓ 도움말</button>
    <button class="btn btn-primary" onclick="location.href='index.html'">🏠 Lingo 앱으로</button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-text" id="modalText"></div>
    <button class="modal-close" onclick="closeModal()">닫기</button>
  </div>
</div>

<div class="status-bar">
  <span id="statusText">준비</span>
  <span id="chunkSummary">청크: 0개</span>
</div>

<script>
// ===== CONSTANTS =====
const CHUNK_PREFIX = 'lingo_chunk_';
const API_KEY_KEY = 'lingo_openai_key';
const CAT_NAMES = {etc:'기타',travel:'여행',golf:'골프',shop:'쇼핑',restaurant:'레스토랑',direction:'길찾기',hotel:'호텔',airport:'공항',emergency:'응급'};
const LVL_NAMES = {beginner:'초급',intermediate:'중급',advanced:'고급'};
let currentChunk = null; // {cat, lvl, phrases:[]}
let generatedPhrases = [];

const HELP_TEXT = `🔧 Lingo Data Gen 사용법

1️⃣ 청크 관리
   • 카테고리+레벨 선택 → "불러오기"
   • 구문 직접 추가/수정/삭제
   • JSON 파일 가져오기/보내기 지원

2️⃣ AI 생성
   • OpenAI API Key 입력 (localStorage 저장)
   • 카테고리/레벨/개수 선택
   • "생성 시작" → 결과 확인 → 청크에 저장

3️⃣ 병합
   • "전체 병합" → 모든 청크를 하나로
   • "Lingo 앱에 배포" → localStorage에 저장

⚠️ API Key는 브라우저 localStorage에만 저장됩니다.
`;

// ===== INIT =====
function init(){
  const key = localStorage.getItem(API_KEY_KEY);
  if(key) document.getElementById('apiKey').value = key;
  updateStatus();
}
init();

// ===== UI =====
function showPanel(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

function showModal(title, text){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal(e){
  if(!e || e.target.id === 'modalOverlay') document.getElementById('modalOverlay').classList.remove('active');
}

function updateStatus(){
  const keys = Object.keys(localStorage).filter(k=>k.startsWith(CHUNK_PREFIX));
  document.getElementById('chunkSummary').textContent = '청크: ' + keys.length + '개';
}

// ===== CHUNK MANAGEMENT =====
function getChunkKey(cat, lvl){ return CHUNK_PREFIX + cat + '_' + lvl; }

function loadChunk(){
  const cat = document.getElementById('chunkCat').value;
  const lvl = document.getElementById('chunkLvl').value;
  const key = getChunkKey(cat, lvl);
  const raw = localStorage.getItem(key);
  currentChunk = {cat, lvl, phrases: raw ? JSON.parse(raw) : []};
  renderChunkEditor();
  document.getElementById('chunkEditor').style.display = 'block';
  updateStatus();
}

function newChunk(){
  currentChunk = {cat: document.getElementById('chunkCat').value, lvl: document.getElementById('chunkLvl').value, phrases: []};
  renderChunkEditor();
  document.getElementById('chunkEditor').style.display = 'block';
}

function renderChunkEditor(){
  const label = CAT_NAMES[currentChunk.cat] + ' / ' + LVL_NAMES[currentChunk.lvl] + ' (' + currentChunk.phrases.length + '개)';
  document.getElementById('editingLabel').textContent = label;
  let html = '';
  currentChunk.phrases.forEach((p, i) => {
    html += '<div class="phrase-row">' +
      '<input value="' + (p.en||'').replace(/"/g,'&quot;') + '" placeholder="영어" onchange="updatePhrase('+i+','en',this.value)">' +
      '<input value="' + (p.jp||'').replace(/"/g,'&quot;') + '" placeholder="일본어" onchange="updatePhrase('+i+','jp',this.value)">' +
      '<input value="' + (p.ko||'').replace(/"/g,'&quot;') + '" placeholder="한국어" onchange="updatePhrase('+i+','ko',this.value)">' +
      '<input value="' + (p.zh||'').replace(/"/g,'&quot;') + '" placeholder="중국어" onchange="updatePhrase('+i+','zh',this.value)">' +
      '<span class="del-btn" onclick="removePhrase('+i+')">×</span>' +
      '</div>';
  });
  document.getElementById('phraseList').innerHTML = html || '<div style="color:rgba(255,255,255,.3);padding:20px;text-align:center">구문이 없습니다. ➕ 버튼으로 추가하세요.</div>';
}

function addPhraseRow(){
  currentChunk.phrases.push({en:'',jp:'',ko:'',zh:''});
  renderChunkEditor();
}
function updatePhrase(idx, field, val){ currentChunk.phrases[idx][field] = val; }
function removePhrase(idx){ currentChunk.phrases.splice(idx,1); renderChunkEditor(); }

function saveChunk(){
  const key = getChunkKey(currentChunk.cat, currentChunk.lvl);
  localStorage.setItem(key, JSON.stringify(currentChunk.phrases));
  showModal('✅ 저장 완료', label(currentChunk.cat, currentChunk.lvl) + ' 청크가 저장되었어요!');
  updateStatus();
}

function deleteChunk(){
  if(!confirm('정말 삭제할까요?')) return;
  const key = getChunkKey(currentChunk.cat, currentChunk.lvl);
  localStorage.removeItem(key);
  currentChunk.phrases = [];
  renderChunkEditor();
  updateStatus();
}

function importJSON(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0]; if(!file) return;
    try{
      const text = await file.text();
      const json = JSON.parse(text);
      if(Array.isArray(json)) currentChunk.phrases = json;
      else if(json[currentChunk.cat] && json[currentChunk.cat][currentChunk.lvl]) currentChunk.phrases = json[currentChunk.cat][currentChunk.lvl];
      else throw new Error('지원하지 않는 JSON 형식');
      renderChunkEditor();
      showModal('✅ 가져오기 완료', file.name + ' → ' + currentChunk.phrases.length + '개 구문');
    }catch(err){ showModal('❌ 오류', err.message); }
  };
  input.click();
}

function exportChunk(){
  const blob = new Blob([JSON.stringify(currentChunk.phrases, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = currentChunk.cat + '_' + currentChunk.lvl + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ===== AI GENERATION =====
function saveApiKey(){ localStorage.setItem(API_KEY_KEY, document.getElementById('apiKey').value); }

async function generatePhrases(){
  const key = document.getElementById('apiKey').value.trim();
  if(!key){ showModal('⚠️ API Key 필요','OpenAI API Key를 입력해주세요.'); return; }
  
  const cat = document.getElementById('genCat').value;
  const lvl = document.getElementById('genLvl').value;
  const count = parseInt(document.getElementById('genCount').value) || 10;
  let prompt = document.getElementById('genPrompt').value;
  prompt = prompt.replace(/\{\{category\}\}/g, cat).replace(/\{\{level\}\}/g, lvl).replace(/\{\{count\}\}/g, count);

  const btn = document.getElementById('genBtn');
  const status = document.getElementById('genStatus');
  btn.disabled = true; status.textContent = '⏳ 생성 중...';

  try{
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method:'POST',
      headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},
      body: JSON.stringify({model:'gpt-3.5-turbo',messages:[{role:'user',content:prompt}],temperature:0.7})
    });
    if(!res.ok){ const err = await res.text(); throw new Error('API 오류: ' + err); }
    const data = await res.json();
    const content = data.choices[0].message.content;
    // Extract JSON from markdown code block if present
    const jsonMatch = content.match(/```json\n?([\s\S]*?)\n?```/) || content.match(/```\n?([\s\S]*?)\n?```/);
    const jsonStr = jsonMatch ? jsonMatch[1] : content;
    generatedPhrases = JSON.parse(jsonStr);
    if(!Array.isArray(generatedPhrases)) throw new Error('응답이 배열이 아닙니다');

    // Render preview
    let html = '<div style="max-height:300px;overflow-y:auto">';
    generatedPhrases.forEach((p,i) => {
      html += '<div style="padding:8px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px">' +
        '<b>' + (i+1) + '.</b> ' + (p.en||'') + ' | ' + (p.jp||'') + ' | ' + (p.ko||'') + ' | ' + (p.zh||'') + '</div>';
    });
    html += '</div>';
    document.getElementById('genPreview').innerHTML = html;
    document.getElementById('genResult').style.display = 'block';
    status.textContent = '✅ ' + generatedPhrases.length + '개 생성 완료';
  }catch(e){
    status.textContent = '❌ 실패: ' + e.message;
    showModal('❌ 생성 실패', e.message);
  }finally{
    btn.disabled = false;
  }
}

function acceptGenerated(){
  currentChunk = {cat: document.getElementById('genCat').value, lvl: document.getElementById('genLvl').value, phrases: generatedPhrases};
  saveChunk();
  document.getElementById('genResult').style.display = 'none';
  document.getElementById('genStatus').textContent = '';
  showPanel('p-chunks');
  renderChunkEditor();
}

function discardGenerated(){
  generatedPhrases = [];
  document.getElementById('genResult').style.display = 'none';
  document.getElementById('genStatus').textContent = '';
}

// ===== MERGE =====
function getAllChunks(){
  const cats = ['etc','travel','golf','shop','restaurant','direction','hotel','airport','emergency'];
  const lvls = ['beginner','intermediate','advanced'];
  const merged = {};
  cats.forEach(c => { merged[c] = {}; lvls.forEach(l => {
    const key = getChunkKey(c,l);
    const raw = localStorage.getItem(key);
    merged[c][l] = raw ? JSON.parse(raw) : [];
  });});
  return merged;
}

function mergeAllChunks(){
  const merged = getAllChunks();
  const total = Object.values(merged).flatMap(c=>Object.values(c)).reduce((a,b)=>a+b.length,0);
  showModal('🔀 병합 완료','총 ' + total + '개 구문이 병합되었어요!\n\n"미리보기" 탭에서 JSON을 확인하거나 "Lingo 앱에 배포"할 수 있어요.');
}

function previewMerge(){
  const merged = getAllChunks();
  let stats = ''; let total = 0;
  Object.entries(merged).forEach(([c,lvls]) => {
    Object.entries(lvls).forEach(([l,arr]) => {
      if(arr.length > 0){ stats += CAT_NAMES[c] + '/' + LVL_NAMES[l] + ': ' + arr.length + '개\n'; total += arr.length; }
    });
  });
  document.getElementById('mergeStats').textContent = stats + '\n총: ' + total + '개';
  document.getElementById('mergeOutput').value = JSON.stringify(merged, null, 2);
  document.getElementById('mergePreview').style.display = 'block';
}

function exportMerged(){
  const merged = getAllChunks();
  const blob = new Blob([JSON.stringify(merged, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = 'phrases_merged_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function deployToLingo(){
  const merged = getAllChunks();
  localStorage.setItem('lingo_phrases_v1', JSON.stringify(merged));
  showModal('🚀 배포 완료','병합된 구문이 Lingo 앱에 저장되었어요!\n\n이제 Lingo 앱을 열면 새 데이터로 학습할 수 있습니다.');
}

// ===== SETTINGS =====
async function loadDefaultPhrases(){
  try{
    const res = await fetch('phrases_ollama.json?v=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    // Split into chunks
    Object.entries(data).forEach(([cat,lvls]) => {
      Object.entries(lvls).forEach(([lvl,arr]) => {
        localStorage.setItem(getChunkKey(cat,lvl), JSON.stringify(arr));
      });
    });
    updateStatus();
    showModal('✅ 불러오기 완료','서버 원본을 청크로 분할하여 저장했어요!');
  }catch(e){ showModal('❌ 오류', e.message); }
}

function clearAllChunks(){
  if(!confirm('정말 모든 청크를 삭제할까요?\n이 작업은 되돌릴 수 없습니다.')) return;
  Object.keys(localStorage).filter(k=>k.startsWith(CHUNK_PREFIX)).forEach(k=>localStorage.removeItem(k));
  updateStatus();
  showModal('🗑️ 삭제 완료','모든 청크가 삭제되었어요.');
}

function label(c,l){ return CAT_NAMES[c] + ' / ' + LVL_NAMES[l]; }
