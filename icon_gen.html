<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lingo Icon Generator</title>
  <style>
    body { background: #f0f0f0; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 50px; font-family: sans-serif; }
    canvas { background: white; border-radius: 20%; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .controls { display: flex; gap: 10px; }
    button { padding: 10px 20px; cursor: pointer; background: #2962FF; color: white; border: none; border-radius: 5px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Lingo App Icon Generator</h2>
  <canvas id="canvas512" width="512" height="512"></canvas>
  <canvas id="canvas192" width="192" height="192"></canvas>
  <div class="controls">
    <button onclick="saveIcons()">Save All Icons</button>
  </div>

  <script>
    function drawLingoIcon(ctx, size) {
      const center = size / 2;
      const scale = size / 512;

      // 1. Background Cleanup
      ctx.clearRect(0, 0, size, size);

      // 2. Shadow Effect
      ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
      ctx.shadowBlur = 20 * scale;
      ctx.shadowOffsetX = 10 * scale;
      ctx.shadowOffsetY = 10 * scale;

      // 3. Secondary Bubble (Purple)
      const subX = center + 80 * scale;
      const subY = center + 80 * scale;
      const subR = 80 * scale;

      const purpleGrad = ctx.createLinearGradient(subX-subR, subY-subR, subX+subR, subY+subR);
      purpleGrad.addColorStop(0, '#A855F7');
      purpleGrad.addColorStop(1, '#6B21A8');
      
      ctx.fillStyle = purpleGrad;
      ctx.beginPath();
      ctx.arc(subX, subY, subR, 0, Math.PI * 2);
      ctx.fill();
      
      // Sub Bubble Tail
      ctx.beginPath();
      ctx.moveTo(subX + subR*0.5, subY + subR*0.8);
      ctx.lineTo(subX + subR*1.1, subY + subR*1.1);
      ctx.lineTo(subX + subR*0.8, subY + subR);
      ctx.fill();

      // 4. Dots in Purple Bubble
      ctx.shadows = 0; // disable shadow for dots
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'white';
      const dotR = 6 * scale;
      const startDotX = subX - 20 * scale;
      for(let i=0; i<3; i++) {
        ctx.beginPath();
        ctx.arc(startDotX + (i * 15 * scale), subY, dotR, 0, Math.PI * 2);
        ctx.fill();
      }

      // 5. Primary Bubble (Blue)
      ctx.shadowBlur = 30 * scale;
      ctx.shadowOffsetX = 15 * scale;
      ctx.shadowOffsetY = 15 * scale;

      const blueGrad = ctx.createLinearGradient(0, 0, size, size);
      blueGrad.addColorStop(0, '#00B4FF');
      blueGrad.addColorStop(1, '#2962FF');

      ctx.fillStyle = blueGrad;
      ctx.beginPath();
      ctx.arc(center, center, 150 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Primary Bubble Tail
      ctx.beginPath();
      ctx.moveTo(center - 100 * scale, center + 80 * scale);
      ctx.lineTo(center - 150 * scale, center + 120 * scale);
      ctx.lineTo(center - 80 * scale, center + 130 * scale);
      ctx.fill();

      // 6. Big White "L"
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
      ctx.fillStyle = 'white';
      ctx.font = `bold ${160 * scale}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('L', center, center + 10 * scale);
    }

    function saveIcons() {
      const c512 = document.getElementById('canvas512');
      const c192 = document.getElementById('canvas192');
      
      drawLingoIcon(c512.getContext('2d'), 512);
      drawLingoIcon(c192.getContext('2d'), 192);

      const link512 = document.createElement('a');
      link512.download = 'icon-512.png';
      link512.href = c512.toDataURL('image/png');
      link512.click();

      const link192 = document.createElement('a');
      link192.download = 'icon-192.png';
      link192.href = c192.toDataURL('image/png');
      link192.click();
    }

    // Auto-draw on load
    window.onload = () => {
      drawLingoIcon(document.getElementById('canvas512').getContext('2d'), 512);
      drawLingoIcon(document.getElementById('canvas192').getContext('2d'), 192);
    };
  </script>
</body>
</html>
