# ============================================================================
#  Cloud Run deploy — kazunori279/live-translator
# ============================================================================
#
#  Workflow:  main branch push  ->  Cloud Run (live-translation service)
#  Auth:      Workload Identity Federation (keyless) or service-account JSON
#  Secret:    GEMINI_LIVE_KEY
#
#  PREREQUISITES (one-time):
#    1. Create a service account with roles/run.admin + roles/iam.serviceAccountUser
#       gcloud iam service-accounts create github-deployer --project=YOUR_PROJECT
#       for r in run.admin iam.serviceAccountUser artifactregistry.admin cloudbuild.builds.editor; do
#         gcloud projects add-iam-policy-binding YOUR_PROJECT \
#           --member="serviceAccount:github-deployer@YOUR_PROJECT.iam.gserviceaccount.com" \
#           --role="roles/$r"
#       done
#
#    2. Set up Workload Identity Federation:
#       gcloud iam workload-identity-pools create github-pool --project=YOUR_PROJECT --location=global
#       gcloud iam workload-identity-pools providers create github-provider \
#         --project=YOUR_PROJECT --location=global --workload-identity-pool=github-pool \
#         --display-name="GitHub" --attribute-mapping="google.subject=assertion.sub,attribute.actor=assertion.actor,attribute.repository=assertion.repository" \
#         --issuer-uri="https://token.actions.githubusercontent.com"
#       gcloud iam service-accounts add-iam-policy-binding \
#         github-deployer@YOUR_PROJECT.iam.gserviceaccount.com \
#         --project=YOUR_PROJECT --role=roles/iam.workloadIdentityUser \
#         --member="principalSet://iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github-pool/attribute.repository/YOUR_ORG/YOUR_REPO"
#
#    3. In GitHub repo settings, add secrets:
#       - GCP_PROJECT_ID       (your GCP project ID)
#       - GCP_WORKLOAD_IDP     (projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github-pool/providers/github-provider)
#       - GCP_SERVICE_ACCOUNT  (github-deployer@YOUR_PROJECT.iam.gserviceaccount.com)
#       - GEMINI_LIVE_KEY      (the API key)
#
#  For simpler setup (less secure), use GCP_SA_KEY (JSON key) instead.
# ============================================================================

name: Deploy Live Translator

on:
  push:
    branches: [main]
    paths:
      - "live-translator-deploy/.github/workflows/**"
      - "live-translator-deploy/scripts/**"
  workflow_dispatch:                       # manual trigger

permissions:
  contents: read
  id-token: write                          # required for WIF

concurrency:
  group: deploy-live-translator
  cancel-in-progress: false                # never cancel in-progress deploy

jobs:
  deploy:
    name: Build & deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone live-translator
        uses: actions/checkout@v4
        with:
          repository: kazunori279/live-translator
          path: live-translator
          ref: main

      - name: Authenticate to Google Cloud
        if: env.GCP_SA_KEY == ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDP }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (legacy JSON key)
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Enable required APIs
        run: |
          gcloud services enable \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            cloudbuild.googleapis.com \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        id: deploy
        env:
          GEMINI_LIVE_KEY: ${{ secrets.GEMINI_LIVE_KEY }}
          REGION: us-central1
          SERVICE: live-translation
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE}" \
            --source "./live-translator" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${REGION}" \
            --allow-unauthenticated \
            --timeout 3600 \
            --memory 1Gi \
            --cpu 1 \
            --concurrency 10 \
            --min-instances 1 \
            --max-instances 1 \
            --set-env-vars "GEMINI_LIVE_KEY=${GEMINI_LIVE_KEY}"

      - name: Get service URL
        id: url
        env:
          REGION: us-central1
          SERVICE: live-translation
        run: |
          SERVICE_URL=$(gcloud run services describe "${SERVICE}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${REGION}" \
            --format="value(status.url)")
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"
          echo "Deployed: ${SERVICE_URL}"

      - name: Update Lingo PWA iframe URL
        env:
          SERVICE_URL: ${{ steps.url.outputs.service_url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 - <<PY
          import re
          with open("index.html") as f: c = f.read()
          new, n = re.subn(
              r'(data-live-url=")[^"]*(")',
              r'\1' + "${{ steps.url.outputs.service_url }}" + r'\2',
              c, count=1)
          if n:
              with open("index.html", "w") as f: f.write(new)
              print(f"Updated data-live-url ({n} change)")
          else:
              print("WARN: no data-live-url attribute found")
          PY
          if git diff --quiet index.html; then
            echo "No change to index.html"
          else
            git add index.html
            git commit -m "M2: update live-translator URL [skip ci]" \
              -m "Auto-updated by deploy workflow to ${{ steps.url.outputs.service_url }}"
            git push
          fi

      - name: Summary
        if: success()
        run: |
          echo "## Deploy success" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: live-translation" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.url.outputs.service_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Region: us-central1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lingo PWA iframe URL: auto-updated" >> "$GITHUB_STEP_SUMMARY"
